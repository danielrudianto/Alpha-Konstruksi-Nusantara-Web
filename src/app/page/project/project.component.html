<div class="container mb-5">
  <div class="row">
    <div class="col-12">
      <h2 class="mb-3">Notable Past Projects</h2>
    </div>
  </div>
  <div class="row justify-content-center">
    <div
      class="col-xl-3 col-lg-4 col-md-6 col-sm-10 col-12 align-items-stretch"
      *ngFor="let project of projects"
    >
      <div class="card w-100 h-100">
        <!-- Need a background image that zooms when hover -->
        <div class="project-image-wrapper">
          <div
            [routerLink]="['/Project', project.id]"
            class="project-image"
            [ngStyle]="{ 'background-image': 'url(' + project.img + ')' }"
          ></div>
        </div>
        <div class="p-3">
          <p>{{ project.location }}</p>
          <h3>{{ project.name }}</h3>
        </div>
      </div>
    </div>
  </div>
</div>
