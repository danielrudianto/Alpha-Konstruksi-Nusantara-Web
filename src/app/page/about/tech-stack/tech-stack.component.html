<div class="tech-stack__wrapper">
  <ngx-slick-carousel
    class="carousel"
    #slickModal="slick-carousel"
    [config]="slideConfig"
  >
    <div ngxSlickItem class="slide" *ngFor="let slide of slides">
      <img src="{{ slide.img }}" alt="" width="100%" />
    </div>
  </ngx-slick-carousel>
</div>
